
spring.application.name=AISurvey Backend

server.port=8081
server.error.include-message=never
server.error.include-binding-errors=never
server.servlet.context-path=/api


# Sırlar ortam değişkeninden gelir (.env / compose env_file); depoda düz metin durmaz.
spring.data.mongodb.uri=${MONGO_URI:mongodb://mongodb:27017/aisurvey_survey}
# @Indexed(unique) alanları (email, inviteCode) veritabanı düzeyinde de zorlansın.
spring.data.mongodb.auto-index-creation=true


app.jwt.refresh-expiration-days=7
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.expiration-minutes=1440
app.jwt.refresh-token.expiration=604800000
app.jwt.refresh-token.expiration-minutes=10080
app.jwt.password-reset.expiration=900000
app.jwt.password-reset.expiration-minutes=15


# Sağlayıcı değişirse (Brevo, Resend, kurumsal SMTP) .env yeter, kod değişmez.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Gönderen adresi: sağlayıcıda doğrulanmış adres. Verilmezse SMTP kullanıcı adı.
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.health.mail.enabled=false


# ===== ADRESLER: TEK KAYNAK =====
# Canlıya çıkarken .env içindeki APP_FRONTEND_URL / APP_PUBLIC_URL değerlerini
# doldurmak yeterlidir (compose env_file ile container'a geçer). CORS ve PayTR
# adresleri bunlardan türetilir, başka hiçbir yerde alan adı yazmaz.
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.public.url=${APP_PUBLIC_URL:http://localhost:8081}


app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${app.frontend.url}}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD,PATCH
app.cors.allow-credentials=true
app.cors.max-age=3600
logging.level.org.springframework.data.mongodb.core=WARN
logging.level.org.springframework=INFO
logging.level.com.survey.ai=INFO
logging.level.root=INFO
# Site admini panelindeki log sayfası bu dosyayı okur; boyut rolling policy ile sınırlanır.
logging.file.name=logs/aisurvey.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

logging.level.com.company.survey=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.security=INFO


spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Europe/Istanbul


spring.data.rest.base-path=/api
spring.data.rest.default-page-size=20


spring.security.filter.order=10


spring.web.resources.add-mappings=false


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/api/api-docs/swagger-config
springdoc.swagger-ui.url=/api/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.server.url=/apis
springdoc.swagger-ui.csrf.enabled=false
springdoc.packagesToScan=com.survey.ai.controller
springdoc.pathsToMatch=/api/**

# Kafka Configuration
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=survey-response-group
spring.kafka.consumer.auto-offset-reset=earliest


spring.jmx.enabled=false


spring.cache.cache-names=lastComments,questionAverages,sentimentCounts,responsesPerDay,generalAverage
spring.cache.redis.time-to-live=60000


spring.main.allow-bean-definition-overriding=false

# Hesap kilidi: ard arda bu kadar hatalı şifre denemesinden sonra hesap
# geçici olarak kilitlenir. IP başına çalışan RateLimitFilter'ı tamamlar;
# saldırgan IP değiştirse bile hesap bazlı sınır işler.
app.security.login.max-attempts=5
# İlk kilit bu kadar dakika; her yeni kilitte süre katsayıyla çarpılır
# (15 -> 75 -> 375 dakika). Israrlı deneyenin maliyeti hızla artar,
# şifresini karıştıran gerçek kullanıcı yalnızca ilk kısa süreyi bekler.
app.security.login.lock-minutes=15
app.security.login.lock-escalation-factor=5
# Bu kadar süreli kilitten sonra hesap yalnızca şifre sıfırlanınca açılır;
# kullanıcıya sıfırlama bağlantısı e-postayla gönderilir.
app.security.login.max-lock-cycles=3

# İlk site admini. Yalnızca .env'den gelir; kodda varsayılan YOKTUR. Değişkenler
# boşsa hesap açılmaz (bkz. SiteAdminInitializer).
app.site-admin.email=${SITE_ADMIN_EMAIL:}
app.site-admin.password=${SITE_ADMIN_PASSWORD:}

paytr.merchant-id=${PAYTR_MERCHANT_ID}
paytr.merchant-key=${PAYTR_MERCHANT_KEY}
paytr.merchant-salt=${PAYTR_MERCHANT_SALT}
paytr.success-url=${app.frontend.url}/payment/success
paytr.fail-url=${app.frontend.url}/payment/failed
paytr.callback-url=${app.public.url}/api/v1/payments/paytr/callback
paytr.test-mode= true