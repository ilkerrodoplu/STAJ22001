<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeni Mesajınız Var</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; color: #333333; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
    .content { padding: 20px; background-color: #f9f9f9; }
    .preview { background-color: #ffffff; border-left: 4px solid #2c3e50; padding: 12px 16px; margin: 16px 0; }
    .footer { text-align: center; padding: 10px; font-size: 12px; color: #666666; }
    .button { display: inline-block; background-color: #2c3e50; color: white; text-decoration: none;
      padding: 10px 20px; margin: 20px 0; border-radius: 5px; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Yeni Mesajınız Var</h1>
  </div>
  <div class="content">
    <h2>Merhaba <span th:text="${name}">İsim</span>,</h2>
    <p><strong th:text="${fromLabel}">Gönderen</strong> size bir mesaj gönderdi:</p>
    <div class="preview">
      <p th:text="${preview}">Mesaj önizlemesi</p>
    </div>
    <div style="text-align: center;">
      <a th:href="${messagesUrl}" class="button">Mesajı Görüntüle</a>
    </div>
  </div>
  <div class="footer">
    <p>&copy; 2025 AI Anket Analiz. Tüm hakları saklıdır.</p>
  </div>
</div>
</body>
</html>
