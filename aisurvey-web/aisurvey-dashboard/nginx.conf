server {
  listen 80;
  server_name _;

  root   /usr/share/nginx/html;
  index  index.html;

  # ===== Güvenlik başlıkları =====
  # Oturum token'ı localStorage'da tutuluyor; yani panelde çalışan herhangi bir
  # yabancı script token'ı okuyup dışarı gönderebilir. Buradaki asıl savunma
  # script-src'dir: üretim derlemesinde satır içi script YOKTUR (yalnızca
  # /static/js/main.*.js), bu yüzden 'unsafe-inline' vermeden kapatabiliyoruz.
  # Enjekte edilen <script> ya da onerror="..." tarayıcı tarafından çalıştırılmaz.
  #
  # style-src'de 'unsafe-inline' var: Tailwind/React satır içi stil üretiyor ve
  # stil enjeksiyonu script çalıştırmaya göre çok daha düşük riskli.
  #
  # img-src https: geniş: şirket logoları dışarıdan verilen URL'ler olabiliyor.
  #
  # connect-src: backend farklı bir origin'de (REACT_APP_API_URL). Derleme anında
  # bilinmediği için localhost + https serbest bırakıldı; alan adınız kesinleşince
  # buraya tek tek yazmak daha dar olur.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:8081 https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Panelin iframe'e gömülüp tıklama hırsızlığına (clickjacking) alet edilmesini engeller.
  add_header X-Frame-Options "DENY" always;

  # Tarayıcı Content-Type'ı tahmin etmeye çalışmasın; yüklenen dosyanın
  # script olarak yorumlanması bu yolla oluyor.
  add_header X-Content-Type-Options "nosniff" always;

  # Anket bağlantıları dışarı verilirken tam adres (ve içindeki kod) sızmasın.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  location / {
    try_files $uri /index.html;
  }
}
